<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio | Norts</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ecebe6">
<link rel="icon" type="image/png" sizes="512x512" href="../assets/icon-512.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Roboto+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "Grifter";
    src: url("../assets/GRIFTERBold.woff2") format("woff2");
    font-weight: 700 900;
    font-display: swap;
  }
  :root {
    --bg: #ecebe6; --fg: #0d0d0d; --mute: #5c5c57; --soft: #2a2a28; --panel: #e2e1db;
    --line: rgba(13,13,13,.16); --acid: #ff3b00; --acid-ink: #b02800; --on-acid: #0d0d0d;
    --display: "Grifter", "Unbounded", sans-serif; --mono: "Roboto Mono", monospace; --jp: "Noto Sans JP", sans-serif;
    --gutter: clamp(16px, 4vw, 56px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--mono); font-size: 14px; line-height: 1.7; -webkit-font-smoothing: antialiased; font-synthesis: none; }
  a { color: inherit; }
  img, video, iframe { display: block; max-width: 100%; }
  :focus-visible { outline: 3px solid var(--acid-ink); outline-offset: 3px; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .logo-orange { filter: url(#toOrange); }
  .btn {
    display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--fg); border-radius: 999px;
    padding: 12px 22px; font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .08em;
    background: none; color: var(--fg); cursor: pointer; transition: .3s; text-decoration: none;
  }
  .btn:hover { background: var(--fg); color: var(--bg); }
  .tag { display: inline-block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; border: 1px solid var(--line); padding: 2px 8px; color: var(--mute); }

  /* ---------- lock screen ---------- */
  .lock { min-height: 100svh; display: grid; place-items: center; padding: 40px var(--gutter); }
  .lock-card { width: min(420px, 100%); }
  .lock-card .logo { display: inline-block; }
  .lock-card .logo img { height: 40px; width: auto; }
  .lock h1 { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: clamp(44px, 12vw, 72px); line-height: .9; letter-spacing: -.04em; margin: 28px 0 12px; }
  .lock p { font-family: var(--jp); color: var(--soft); }
  .lock form { margin-top: 28px; display: grid; gap: 12px; }
  .lock label { font-size: 11px; letter-spacing: .12em; color: var(--mute); }
  .lock input[type="password"] {
    width: 100%; font: inherit; font-size: 16px; color: var(--fg); background: #fff;
    border: 1px solid var(--fg); border-radius: 0; padding: 12px 14px;
  }
  .lock .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .lock .remember { display: flex; align-items: center; gap: 8px; font-family: var(--jp); font-size: 12px; color: var(--soft); letter-spacing: 0; }
  .lock .remember input { width: 16px; height: 16px; accent-color: var(--acid-ink); }
  .lock .error { min-height: 1.7em; font-family: var(--jp); font-size: 13px; color: var(--acid-ink); }
  .lock .back { display: inline-block; margin-top: 32px; font-size: 12px; color: var(--mute); }
  .lock .btn[disabled] { opacity: .5; pointer-events: none; }

  /* ---------- unlocked ---------- */
  .bar {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px var(--gutter); background: rgba(236,235,230,.9); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .bar img { height: 32px; width: auto; }
  .bar .btn { padding: 8px 16px; }
  #vault { padding: clamp(48px, 8vw, 96px) var(--gutter) 96px; max-width: 1280px; margin: 0 auto; }

  /* content blocks used by portfolio-src/content.html */
  .pf-intro { border-bottom: 1px solid var(--fg); padding-bottom: 24px; margin-bottom: 48px; }
  .pf-intro h1 { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: clamp(48px, 10vw, 140px); line-height: .85; letter-spacing: -.04em; }
  .pf-intro p { font-family: var(--jp); color: var(--soft); margin-top: 16px; max-width: 44em; }
  .pf-item { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: clamp(20px, 4vw, 56px); padding: 40px 0; border-bottom: 1px solid var(--line); }
  .pf-media { background: var(--panel); }
  .pf-media img, .pf-media video { width: 100%; height: auto; }
  .pf-media iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; }
  .pf-media .placeholder { aspect-ratio: 16 / 9; display: grid; place-items: center; color: var(--mute); font-size: 12px; letter-spacing: .1em; }
  .pf-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--mute); }
  .pf-body h2 { font-family: var(--jp); font-weight: 700; font-size: clamp(20px, 2.4vw, 28px); line-height: 1.4; margin: 12px 0 20px; }
  .pf-credits { margin-bottom: 20px; }
  .pf-credits div { display: flex; gap: 16px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .pf-credits dt { width: 7.5em; flex: none; color: var(--mute); }
  .pf-credits dd { font-family: var(--jp); }
  .pf-body p { font-family: var(--jp); color: var(--soft); line-height: 2; }
  .pf-body p + p { margin-top: 1em; }
  .pf-body a { color: var(--acid-ink); }
  @media (max-width: 820px) { .pf-item { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="toOrange" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="0 0 1 0 0  .9159 0 .0841 0 0  1.1916 0 -.1916 0 0  0 0 0 1 0"/>
  </filter>
</svg>

<main class="lock" id="lock">
  <div class="lock-card">
    <a class="logo" href="../"><img class="logo-orange" src="../assets/logo-blue.png" alt="Norts トップへ" width="765" height="321"></a>
    <h1>Portfolio</h1>
    <p>このページはパスワードで保護されています。閲覧用のパスワードを入力してください。</p>
    <form id="unlockForm">
      <label for="pw">PASSWORD</label>
      <input type="password" id="pw" name="password" autocomplete="current-password" required aria-describedby="pwError">
      <div class="row">
        <label class="remember"><input type="checkbox" id="remember">このタブを閉じるまで記憶する</label>
        <button class="btn" type="submit" id="unlockBtn">UNLOCK <span aria-hidden="true">→</span></button>
      </div>
      <p class="error" id="pwError" role="alert" aria-live="assertive"></p>
    </form>
    <a class="back" href="../">← norts.jp に戻る</a>
  </div>
</main>

<div id="unlocked" hidden>
  <header class="bar">
    <a href="../"><img class="logo-orange" src="../assets/logo-blue.png" alt="Norts トップへ" width="765" height="321"></a>
    <button class="btn" type="button" id="lockBtn">LOCK</button>
  </header>
  <main id="vault" tabindex="-1"></main>
</div>

<!--
  Encrypted content. Do not edit by hand: write portfolio-src/content.html and run
    node tools/encrypt-portfolio.mjs
  which replaces the JSON below (AES-256-GCM, key from PBKDF2-SHA256).
-->
<script type="application/json" id="payload">{}</script>

<script>
  const $ = id => document.getElementById(id);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const payload = JSON.parse($("payload").textContent);
  const SESSION_KEY = "norts-portfolio-key";

  const deriveKey = async password => {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(payload.salt), iterations: payload.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]
    );
  };
  const decrypt = async key => {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(payload.iv) }, key, b64(payload.ct));
    return new TextDecoder().decode(plain);
  };
  const show = html => {
    $("vault").innerHTML = html;
    $("lock").hidden = true;
    $("unlocked").hidden = false;
    $("vault").focus();
  };
  const store = {
    get: () => { try { return sessionStorage.getItem(SESSION_KEY); } catch { return null; } },
    set: v => { try { sessionStorage.setItem(SESSION_KEY, v); } catch {} },
    clear: () => { try { sessionStorage.removeItem(SESSION_KEY); } catch {} },
  };

  if (!payload.ct) {
    $("pwError").textContent = "まだ公開準備中です。";
    $("unlockBtn").disabled = true;
  }

  $("unlockForm").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = $("unlockBtn"), err = $("pwError");
    btn.disabled = true;
    err.textContent = "";
    try {
      const key = await deriveKey($("pw").value);
      const html = await decrypt(key);
      if ($("remember").checked) store.set(toB64(await crypto.subtle.exportKey("raw", key)));
      $("pw").value = "";
      show(html);
    } catch {
      err.textContent = "パスワードが違います。";
      $("pw").select();
    } finally {
      btn.disabled = !payload.ct;
    }
  });

  $("lockBtn").addEventListener("click", () => {
    store.clear();
    $("vault").innerHTML = "";
    $("unlocked").hidden = true;
    $("lock").hidden = false;
    $("pw").focus();
  });

  // reopen without asking again when the key was remembered for this tab
  (async () => {
    const saved = store.get();
    if (!saved || !payload.ct) return;
    try {
      const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
      show(await decrypt(key));
    } catch { store.clear(); }
  })();
</script>
</body>
</html>
